<!DOCTYPE html>
<html>
<head>
  <title>Bikini Bottom University Course Finder</title>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Sans+MS&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Comic Sans MS', cursive;
      margin: 0;
      padding: 0;
      background-image: url('https://static.vecteezy.com/system/resources/thumbnails/038/000/159/small_2x/ai-generated-sunlight-shining-the-surface-and-under-the-blue-ocean-sea-wave-with-clean-waters-in-summer-time-photo.jpg');
      background-size: cover;
      background-attachment: fixed;
      color: #333;
    }

    #chat-container {
      width: 80%;
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background-color: rgba(255, 253, 208, 0.95);
      border-radius: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      border: 6px solid #D4AF37;
      border-style: ridge;
      position: relative;
    }

    h1 {
      text-align: center;
      color: #FF4500;
      margin-bottom: 20px;
      text-shadow: 2px 2px #FFA500, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
      font-size: 2.8em;
    }

    #chat-messages {
      height: 400px;
      border: 3px solid #1E90FF;
      border-radius: 15px;
      overflow-y: auto;
      margin-bottom: 20px;
      padding: 10px;
      background-color: rgba(173, 216, 230, 0.3);
    }

    .message {
      margin: 10px;
      padding: 10px;
      border-radius: 10px;
    }

    .message::before {
      content: '';
      display: inline-block;
      width: 20px;
      height: 20px;
      margin-right: 10px;
      background-size: contain;
      background-repeat: no-repeat;
      vertical-align: middle;
    }

    .user-message {
      background-color: #E3F2FD;
      margin-left: 20%;
    }

    .user-message::before {
      content: '🧽';
    }

    .bot-message {
      background-color: #FFF3E0;
      margin-right: 20%;
    }

    .course-info {
      background-color: #E3F2FD;
      border-left: 4px solid #1E90FF;
      padding: 10px;
      margin: 10px 0;
      border-radius: 0 10px 10px 0;
    }

    .instructor-info {
      margin-left: 20px;
      padding: 8px;
      border-bottom: 1px dashed #1E90FF;
    }

    .instructor-info:last-child {
      border-bottom: none;
    }

    .email-link {
      color: #0066cc;
      text-decoration: none;
    }

    .email-link:hover {
      text-decoration: underline;
    }

    .course-title {
      font-weight: bold;
      color: #FF4500;
      margin-bottom: 5px;
    }

    .bot-message::before {
      content: '🦀';
    }

    #input-container {
      display: flex;
      gap: 10px;
    }

    #user-input {
      flex: 1;
      padding: 10px;
      border: 2px solid #1E90FF;
      border-radius: 10px;
      font-family: inherit;
    }

    #send-button {
      padding: 10px 20px;
      background-color: #FF4500;
      color: white;
      border: 2px solid #8B0000;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      transition: transform 0.2s;
    }

    #send-button:hover {
      background-color: #FF6347;
      transform: scale(1.05);
    }

    #send-button:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    #chat-container::before {
      content: '🌊';
      position: absolute;
      top: -20px;
      left: 20px;
      font-size: 24px;
    }

    #chat-container::after {
      content: '🐚';
      position: absolute;
      bottom: -20px;
      right: 20px;
      font-size: 24px;
    }
  </style>
  <script>
    async function sendMessage() {
      const input = document.getElementById('user-input');
      const message = input.value.trim();

      if (!message) return;

      const chatMessages = document.getElementById('chat-messages');
      const sendButton = document.getElementById('send-button');

      // Display user message
      const userDiv = document.createElement('div');
      userDiv.className = 'message user-message';
      userDiv.textContent = message;
      chatMessages.appendChild(userDiv);

      input.value = '';
      sendButton.disabled = true;
      sendButton.textContent = 'Searching...';

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ message: message })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Unable to search courses.');
        }

        const botDiv = document.createElement('div');
        botDiv.className = 'message bot-message';

        const answer = document.createElement('p');
        answer.textContent = data.answer;
        botDiv.appendChild(answer);

        if (data.courses && data.courses.length > 0) {
          data.courses.forEach(course => {
            const card = document.createElement('div');
            card.className = 'course-info';

            const title = document.createElement('div');
            title.className = 'course-title';
            title.textContent =
                    `${course.subject} ${course.courseNum} — ${course.title}`;
            card.appendChild(title);

            const details = [
              ['Instructor', course.instructor],
              ['Email', course.instructorEmail],
              ['Meeting days', course.meetingDays],
              ['Time', `${formatTime(course.beginTime)} – ${formatTime(course.endTime)}`],
              ['Location', `${course.building} ${course.room}`.trim()],
              ['Instruction', course.instructionMode],
              ['Enrollment', course.enrollment],
              ['CRN', course.crn]
            ];

            details.forEach(([label, value]) => {
              if (!value) return;

              const line = document.createElement('div');
              line.className = 'instructor-info';

              if (label === 'Email') {
                const link = document.createElement('a');
                link.className = 'email-link';
                link.href = `mailto:${value}`;
                link.textContent = value;
                line.textContent = `${label}: `;
                line.appendChild(link);
              } else {
                line.textContent = `${label}: ${value}`;
              }

              card.appendChild(line);
            });

            botDiv.appendChild(card);
          });
        }

        chatMessages.appendChild(botDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

      } catch (error) {
        console.error('Search error:', error);

        const errorDiv = document.createElement('div');
        errorDiv.className = 'message bot-message';
        errorDiv.textContent = 'Oops! Something went wrong: ' + error.message;
        chatMessages.appendChild(errorDiv);

      } finally {
        sendButton.disabled = false;
        sendButton.textContent = 'Send';
        input.focus();
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    }

    function formatTime(time) {
      if (!time) return '';

      const digits = String(time).padStart(4, '0');
      const hours = parseInt(digits.substring(0, 2), 10);
      const minutes = digits.substring(2, 4);

      if (hours > 23 || minutes > 59) return time;

      const period = hours >= 12 ? 'PM' : 'AM';
      const displayHour = hours % 12 || 12;

      return `${displayHour}:${minutes} ${period}`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('user-input');

      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          sendMessage();
        }
      });
    });
  </script>
</head>
<body>
<div id="chat-container">
  <h1>🍔 Bikini Bottom University Course Finder 📚</h1>
  <div id="chat-messages">
    <div class="message bot-message">Ahoy there! 🦀 I'm your Bikini Bottom University course assistant! How can I help you today?</div>
  </div>
  <div id="input-container">
    <input type="text" id="user-input" placeholder="Ask about courses at BBU...">
    <button id="send-button" onclick="sendMessage()">Send</button>
  </div>
</div>
</body>
</html>
